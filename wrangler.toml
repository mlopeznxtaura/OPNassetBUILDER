name = "nextaura-app14-us"
main = "worker.js"
compatibility_date = "2026-06-17"
account_id = "683f127c03af82423467b6fad679252c"

[vars]
BLOB_TIER_ORDER = "assets,supabase,mongo,vercel,oci,aws,r2"

[assets]
directory = "."
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
run_worker_first = true

[[durable_objects.bindings]]
name = "FORGE"
class_name = "ForgeRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ForgeRoom"]

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "opnassetbuilder-blobs"
preview_bucket_name = "opnassetbuilder-blobs-preview"
