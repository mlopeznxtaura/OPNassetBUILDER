<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameForge</title>
<style>
  :root { --bg:#111318; --panel:#1a1d24; --line:#2a2e38; --text:#e8e9ec; --accent:#5cc8ff; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:-apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center; padding:24px; }
  main { width:min(640px, 100%); background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px; }
  h1 { margin:0 0 8px; font-size:28px; color:var(--accent); }
  p { margin:0 0 22px; color:#9aa1ad; line-height:1.5; }
  .cards { display:grid; gap:12px; }
  a.card { display:block; text-decoration:none; color:inherit; border:1px solid var(--line); border-radius:10px; padding:16px; background:#141820; }
  a.card:hover { border-color:var(--accent); background:#182430; }
  a.card strong { display:block; margin-bottom:4px; }
  a.card span { color:#9aa1ad; font-size:13px; }
  main p a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>GameForge</h1>
  <p>Design voxel and sprite assets, then place them in a minimal open world. An agent can drive the same library through <a href="/agent.json">/agent.json</a> and <a href="/mcp">/mcp</a>.</p>
  <div class="cards">
    <a class="card" href="design/index.html">
      <strong>Design &amp; Visualize</strong>
      <span>Paint voxels and pixel sprites, then save them to your library.</span>
    </a>
    <a class="card" href="world/index.html">
      <strong>World Viewer</strong>
      <span>Place assets, save a level, and fly through it.</span>
    </a>
  </div>
</main>
</body>
</html>
